name: CI & Deploy Backend to GCP VM

on:
  push:
    branches:
      - main
    paths:
      - "whatsapp-bridge/**"
      - "harness/**"
      - "whatsapp-mcp-server/**"
      - "web/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Unit & Coverage Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32.3" "mcp[cli]>=1.6.0" "httpx>=0.28.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Run Go Bridge Tests
        run: |
          echo "🧪 Running Go WhatsApp Bridge tests..."
          cd whatsapp-bridge
          go test -race -v -covermode=atomic -coverprofile=coverage.out ./...

      - name: Run Python MCP Server Tests
        run: |
          echo "🧪 Running Python MCP Server tests..."
          cd whatsapp-mcp-server
          python -m unittest discover -s tests -v

      - name: Run Web Panel Tests
        run: |
          echo "🧪 Running Web Panel unit tests..."
          cd web
          npm ci
          npm test

  deploy:
    name: Deploy Go Bridge to GCP Compute Engine
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH & Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: ${{ secrets.GCP_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting backend deployment on GCP VM..."
            
            # Find repository directory
            if [ -d "$HOME/whatsapp-ai" ]; then
              REPO_DIR="$HOME/whatsapp-ai"
            elif [ -d "$HOME/whatsapp-mcp" ]; then
              REPO_DIR="$HOME/whatsapp-mcp"
            elif [ -d "/opt/whatsapp-mcp" ]; then
              REPO_DIR="/opt/whatsapp-mcp"
            else
              REPO_DIR="$(pwd)"
            fi
            
            echo "📂 Working directory: $REPO_DIR"
            cd "$REPO_DIR"

            # Pull latest changes from main
            echo "⬇️ Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            # Ensure Go path is available
            export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin

            # Test Go whatsapp-bridge on VM before rebuilding
            echo "🧪 Validating tests on VM..."
            cd "$REPO_DIR/whatsapp-bridge"
            go test -v ./...

            # Build Go whatsapp-bridge
            echo "🔨 Building Go whatsapp-bridge binary..."
            go build -v -o whatsapp-client .

            # Restart service
            echo "🔄 Restarting WhatsApp Bridge service..."
            if systemctl is-active --quiet whatsapp-bridge.service 2>/dev/null || systemctl list-unit-files | grep -q "whatsapp-bridge.service"; then
              sudo systemctl restart whatsapp-bridge.service
              echo "✅ systemd service (whatsapp-bridge.service) restarted."
            else
              # Fallback if running via process/pkill
              echo "⚠️ systemd service not found, falling back to process restart..."
              pkill -f "./whatsapp-client --server" || true
              sleep 1
              nohup ./whatsapp-client --server --port 8080 > "$HOME/whatsapp-bridge.log" 2>&1 &
              echo "✅ Process started in background."
            fi

            # Health verification
            sleep 2
            if curl -s -f http://127.0.0.1:8080/api/connections >/dev/null 2>&1 || curl -s -f http://localhost:8080/api/connections >/dev/null 2>&1; then
              echo "🎉 WhatsApp Bridge is healthy and responding on port 8080!"
            else
              echo "⚠️ Service restarted (check logs if port 8080 is initializing)."
            fi

