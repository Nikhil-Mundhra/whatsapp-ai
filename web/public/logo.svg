<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="waGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FE675"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- WhatsApp Chat Bubble Background -->
  <path d="M50 8C27.9 8 10 25.9 10 48c0 7.4 2 14.3 5.6 20.3L11 89l21.3-5.6C37.8 86.4 43.7 88 50 88c22.1 0 40-17.9 40-40S72.1 8 50 8z" fill="url(#waGradient)" filter="url(#subtleShadow)"/>

  <!-- 'Ai' Ligature that forms 'N' -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left vertical leg of 'A' (and 'N') -->
    <path d="M32 30 L32 68" stroke-width="7.5"/>
    
    <!-- Crossbar of 'A' -->
    <path d="M32 50 L52 50" stroke-width="6"/>

    <!-- Diagonal stroke of 'A' and 'N' -->
    <path d="M32 30 L68 68" stroke-width="7.5"/>

    <!-- Stem of 'i' (right leg of 'N') -->
    <path d="M68 44 L68 68" stroke-width="7.5"/>
  </g>

  <!-- Dot of 'i' (completes 'i' and top-right apex of 'N') -->
  <circle cx="68" cy="30" r="4.5" fill="#FFFFFF"/>
</svg>
